<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessible Signup Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
            color: #666;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            outline: 3px solid #80bdff;
            border-color: #007bff;
        }

        .error {
            color: #d00000;
            font-size: 14px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:focus-visible {
            outline: 3px solid #222;
            outline-offset: 3px;
        }

        #success {
            color: green;
            text-align: center;
            margin-top: 15px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Sign Up</h1>

        <p>Create your account</p>

        <form id="signupForm" novalidate>

            <div class="form-group">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                    aria-describedby="nameError"
                >

                <div class="error" id="nameError"></div>

            </div>

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                    aria-describedby="emailError"
                >

                <div class="error" id="emailError"></div>

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required
                    aria-describedby="passwordError"
                >

                <div class="error" id="passwordError"></div>

            </div>

            <div class="form-group">

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                    aria-describedby="confirmError"
                >

                <div class="error" id="confirmError"></div>

            </div>

            <button type="submit">Create Account</button>

            <div id="success" role="status" aria-live="polite"></div>

        </form>

    </div>

    <script>

        // Get form element
        const form = document.getElementById("signupForm");

        // Form submission
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Get input values
            let name = document.getElementById("name").value.trim();

            let email = document.getElementById("email").value.trim();

            let password = document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            // Get error elements
            let nameError = document.getElementById("nameError");

            let emailError = document.getElementById("emailError");

            let passwordError = document.getElementById("passwordError");

            let confirmError = document.getElementById("confirmError");

            let success = document.getElementById("success");

            // Clear previous messages
            nameError.textContent = "";
            emailError.textContent = "";
            passwordError.textContent = "";
            confirmError.textContent = "";
            success.textContent = "";

            // Validation
            let isValid = true;

            if (name === "") {

                nameError.textContent = "Please enter your name.";

                isValid = false;
            }

            if (email === "") {

                emailError.textContent = "Please enter your email.";

                isValid = false;

            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

                emailError.textContent = "Please enter a valid email.";

                isValid = false;
            }

            if (password.length < 8) {

                passwordError.textContent =
                    "Password must contain at least 8 characters.";

                isValid = false;
            }

            if (confirmPassword === "") {

                confirmError.textContent =
                    "Please confirm your password.";

                isValid = false;

            } else if (password !== confirmPassword) {

                confirmError.textContent =
                    "Passwords do not match.";

                isValid = false;
            }

            // Display result
            if (isValid) {

                success.textContent =
                    "Signup successful! Your form is valid.";

                form.reset();

            } else {

                // Move keyboard focus to the first invalid field
                form.querySelector(
                    "input:invalid, input:not([value])"
                );

                const firstError = document.querySelector(
                    ".error:not(:empty)"
                );

                if (firstError) {
                    document.getElementById(
                        firstError.id.replace("Error", "")
                    ).focus();
                }
            }

        });

    </script>

</body>
</html>
